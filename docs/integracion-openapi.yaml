openapi: 3.1.0
info:
  title: Campus PESV Education · API de integración
  version: 1.0.0
  summary: Matrículas pedidas por otros sistemas, como el software PESV.
  description: |
    Otro sistema pide que una persona haga el curso de una infracción, y el campus le avisa de
    cada cambio hasta que lo termina. No necesita conocer los cursos del campus: envía la sede, la
    persona y la infracción, y el campus busca el curso por su título o lo elige un administrador
    de la sede. La guía completa, con el flujo y lo que debe construir el sistema que llama, está
    en `docs/INTEGRACION.md`.

    - La clave de integración va en la cabecera `X-Api-Key` y pertenece a una sede: cada solicitud
      dice la suya (`country`), que tiene que ser la de la clave.
    - `POST` es idempotente por `externalId`: un reintento devuelve la solicitud existente.
    - `DELETE` retira una solicitud mientras espera (por ejemplo, si se anula la infracción).
    - Los avisos (`webhooks`) llegan firmados a la dirección que el administrador de la sede
      configure para el sistema.
    - Los campos de las respuestas y de los avisos pueden crecer en esta versión: ignora los que
      no conozcas.
servers:
  - url: https://api-lms.investigaciongipia.com/api/integration/v1
    description: Producción
  - url: http://localhost:3200/api/integration/v1
    description: Desarrollo
security:
  - apiKey: []
webhooks:
  enrollmentRequestUpdated:
    post:
      operationId: enrollmentRequestUpdated
      summary: Aviso de un cambio en una solicitud
      description: |
        El campus lo envía a la dirección de avisos del sistema —https, configurada por el
        administrador de la sede— en el minuto siguiente a cada cambio de `status`: matriculada,
        terminada, dada de baja o rechazada. Lleva el estado de ese momento, no el cambio, y puede
        llegar más de una vez con el mismo estado. El estado inicial no se avisa: ya lo dice la
        respuesta al `POST`.
      security: []
      parameters:
        - name: X-Lms-Signature
          in: header
          required: true
          description: |
            `t=<segundos>,v1=<firma>`: la firma es el HMAC-SHA256 en hexadecimal de `t`, un punto y
            el cuerpo tal como llega, con el resumen SHA-256 en hexadecimal y minúsculas de la clave
            de la sede como secreto. Rechaza el aviso si no coincide o si `t` tiene más de 5 minutos.
          schema:
            type: string
            pattern: '^t=[0-9]+,v1=[0-9a-f]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Notice'
            examples:
              completed:
                summary: Completó el curso
                value:
                  event: enrollment-request.updated
                  sentAt: '2026-11-02T21:16:00.000Z'
                  request:
                    id: 335fbb2d-16c5-4155-a6ad-e0fb4f3d2589
                    externalId: INF-2026-000123
                    status: COMPLETED
                    waitingReason: null
                    detail: La persona completó el curso. Certificado CERT-9F2A61C04B-MH8K2X1Q.
                    country: CO
                    infraction: { code: C29, description: Conducir a velocidad superior a la máxima permitida }
                    person: { firstName: Laura, lastName: Gómez, email: laura.gomez@example.com }
                    course:
                      title: Manejo defensivo
                      url: https://lms.investigaciongipia.com/courses/0d2e2599-30c4-4d7f-868c-6f33ead6f7e8
                    requestedAt: '2026-10-27T13:02:11.087Z'
                    enrolledAt: '2026-10-27T15:40:03.512Z'
                    certificate:
                      code: CERT-9F2A61C04B-MH8K2X1Q
                      verificationUrl: https://lms.investigaciongipia.com/verify?code=CERT-9F2A61C04B-MH8K2X1Q
                      issuedAt: '2026-11-02T21:15:47.000Z'
                      validUntil: '2027-11-02T21:15:47.000Z'
              ping:
                summary: Aviso de prueba del panel
                value:
                  event: ping
                  sentAt: '2026-10-28T16:00:00.000Z'
      responses:
        '2XX':
          description: Recibido. Cualquier otra respuesta, una redirección o ninguna en 10 segundos hacen que se reintente cada 15 minutos hasta que llegue.
tags:
  - name: Matrículas
paths:
  /enrollment-requests:
    post:
      tags: [Matrículas]
      operationId: requestEnrollment
      summary: Pedir que una persona haga un curso
      description: |
        La primera solicitud por una infracción la registra en la sede y le busca curso entre
        los publicados, por su título. Si la infracción tiene un curso publicado y con plaza, la
        persona queda matriculada en el acto (se le crea la cuenta si no la tiene). Si no, la
        solicitud espera y los administradores de la sede reciben un aviso; quedará matriculada
        sola en cuanto el curso esté disponible.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequestInput'
            example:
              externalId: INF-2026-000123
              country: CO
              infractionCode: C29
              infractionDescription: Conducir a velocidad superior a la máxima permitida
              firstName: Laura
              lastName: Gómez
              email: laura.gomez@example.com
      responses:
        '201':
          description: Solicitud nueva, ya atendida (`ENROLLED`) o en espera (`WAITING`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRequest'
              examples:
                waiting:
                  $ref: '#/components/examples/Waiting'
                enrolled:
                  $ref: '#/components/examples/Enrolled'
        '200':
          description: Ya existía con ese `externalId`, la misma persona y la misma infracción. Se devuelve en su estado actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRequest'
        '400':
          $ref: '#/components/responses/InvalidData'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '403':
          description: La sede de la solicitud (`country`) no es la de la clave. Enviarla con la clave de esa sede.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 403
                error: Forbidden
                message: 'La clave es de la sede de Colombia y la solicitud, de la de México: usa la clave de esa sede.'
                timestamp: '2026-10-27T13:02:11.476Z'
                requestId: 4b8e0c1d-2f3a-4e5b-9c6d-7e8f9a0b1c2d
        '409':
          description: |
            El `externalId` ya se usó con otra persona u otra infracción, o el correo pertenece
            a una cuenta que no puede matricularse en la sede (examinador, administrador u otra
            sede). No reintentar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                error: Conflict
                message: El identificador INF-2026-000123 ya se usó para otra solicitud (laura.gomez@example.com, infracción C29). Cada solicitud necesita el suyo.
                timestamp: '2026-10-27T13:02:11.476Z'
                requestId: 18134d3c-58d6-4b26-8640-9087cf0a9f8d
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /enrollment-requests/{externalId}:
    get:
      tags: [Matrículas]
      operationId: getEnrollmentRequest
      summary: Consultar en qué punto está una solicitud
      parameters:
        - name: externalId
          in: path
          required: true
          description: El identificador con que el sistema la envió.
          schema:
            $ref: '#/components/schemas/ExternalId'
      responses:
        '200':
          description: La solicitud en su estado actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRequest'
              examples:
                waiting:
                  $ref: '#/components/examples/Waiting'
                enrolled:
                  $ref: '#/components/examples/Enrolled'
                completed:
                  $ref: '#/components/examples/Completed'
                cancelled:
                  $ref: '#/components/examples/Cancelled'
                rejected:
                  $ref: '#/components/examples/Rejected'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '404':
          description: Este sistema no envió ninguna solicitud con ese identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 404
                error: Not Found
                message: No hay ninguna solicitud con el identificador INF-2026-000999.
                timestamp: '2026-10-27T13:02:11.495Z'
                requestId: 7dd66a4d-f884-4dc5-8cad-a4b17bade22e
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
    delete:
      tags: [Matrículas]
      operationId: withdrawEnrollmentRequest
      summary: Retirar una solicitud que ya no hace falta
      description: |
        Sólo mientras espera: queda `REJECTED` y la persona no llega a matricularse. Si ya no
        esperaba porque se había retirado o rechazado antes, devuelve la solicitud tal cual. Un
        identificador retirado no se reutiliza.
      parameters:
        - name: externalId
          in: path
          required: true
          description: El identificador con que el sistema la envió.
          schema:
            $ref: '#/components/schemas/ExternalId'
      responses:
        '200':
          description: La solicitud, ya fuera de la espera.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRequest'
              examples:
                withdrawn:
                  $ref: '#/components/examples/Withdrawn'
        '401':
          $ref: '#/components/responses/InvalidKey'
        '404':
          description: Este sistema no envió ninguna solicitud con ese identificador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Ya se atendió (la persona está matriculada o terminó el curso) y no se puede retirar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                statusCode: 409
                error: Conflict
                message: 'La solicitud ya se atendió y no se puede retirar: la persona está matriculada o ya terminó el curso.'
                timestamp: '2026-10-27T13:02:11.476Z'
                requestId: 2c1f5e0a-7b55-4d0e-9a51-0c9f3d8b6a11
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: Clave emitida por un administrador de la sede en Administración → Integraciones. Se muestra una sola vez y sólo sirve en su sede.
  schemas:
    ExternalId:
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[A-Za-z0-9._:-]+$'
      description: Identificador de la solicitud en el sistema que la envía, como el número de la infracción. Único por solicitud, sin distinguir mayúsculas.
      examples: [INF-2026-000123]
    InfractionCode:
      type: string
      minLength: 1
      description: |
        Código del tipo de infracción, como lo tenga el sistema que llama. Se guarda en
        mayúsculas, sin tildes, espacios ni signos —`c.29`, `C-29` y `C29` son la misma
        infracción—, con hasta 50 letras y cifras y al menos una.
      examples: [C29, c.29]
    EnrollmentRequestInput:
      type: object
      additionalProperties: false
      required: [externalId, country, infractionCode, firstName, lastName, email]
      properties:
        externalId:
          $ref: '#/components/schemas/ExternalId'
        country:
          type: string
          description: |
            La sede de la persona: `CO` (Colombia) o `MX` (México). También vale su nombre, con o sin
            tildes y en cualquier capitalización. Tiene que ser la sede de la clave.
          examples: [CO, MX, Colombia, México]
        infractionCode:
          $ref: '#/components/schemas/InfractionCode'
        infractionDescription:
          type: [string, 'null']
          maxLength: 255
          description: Qué es la infracción. Opcional; con ella también se busca su curso, y es lo que lee el administrador si tiene que elegirlo.
        firstName:
          $ref: '#/components/schemas/PersonName'
        lastName:
          $ref: '#/components/schemas/PersonName'
        email:
          type: string
          format: email
          maxLength: 191
          pattern: '^[\x21-\x7e]+$'
          description: Con él entra la persona al campus. Sin espacios ni tildes; un dominio internacional, en su forma `xn--`.
    PersonName:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Sin espacios sobrantes. Si llega todo en mayúsculas o todo en minúsculas, se guarda con
        iniciales mayúsculas (`GÓMEZ DE LA CRUZ` → `Gómez de la Cruz`).
    Status:
      type: string
      enum: [WAITING, ENROLLED, COMPLETED, CANCELLED, REJECTED]
      description: |
        - `WAITING`: espera a que el curso esté disponible (ver `waitingReason`).
        - `ENROLLED`: matriculada; puede hacer el curso.
        - `COMPLETED`: aprobó el curso después de pedirse y tiene certificado. No cambia más.
        - `CANCELLED`: ya no está matriculada (baja, curso o cuenta eliminados). Vuelve a `ENROLLED` si un administrador la reactiva.
        - `REJECTED`: no se atenderá (correo del personal o de otra sede, descartada por un administrador de la sede o retirada por el propio sistema). No cambia más.
    WaitingReason:
      type: [string, 'null']
      enum: [COURSE_NOT_ASSIGNED, COURSE_NOT_PUBLISHED, COURSE_FULL, null]
      description: |
        Sólo con `WAITING`:
        - `COURSE_NOT_ASSIGNED`: la infracción todavía no tiene curso: ninguno publicado la nombra en su título y la sede no lo ha elegido.
        - `COURSE_NOT_PUBLISHED`: su curso existe, pero no está publicado.
        - `COURSE_FULL`: su curso no tiene plazas libres (quien ya lo está cursando no espera por esto).
        - `null`: ya se puede atender y se atiende antes de una hora.
    EnrollmentRequest:
      type: object
      required:
        - id
        - externalId
        - status
        - waitingReason
        - detail
        - country
        - infraction
        - person
        - course
        - requestedAt
        - enrolledAt
        - certificate
      properties:
        id:
          type: string
          format: uuid
          description: Identificador de la solicitud en el campus.
        externalId:
          $ref: '#/components/schemas/ExternalId'
        status:
          $ref: '#/components/schemas/Status'
        waitingReason:
          $ref: '#/components/schemas/WaitingReason'
        detail:
          type: string
          description: El estado en una frase en español, para mostrarla a una persona. No es para interpretarla.
        country:
          type: string
          enum: [CO, MX]
          description: La sede, en código ISO.
        infraction:
          type: object
          required: [code, description]
          description: La infracción por la que se pidió.
          properties:
            code:
              type: string
              description: Normalizado, como se guardó.
            description:
              type: [string, 'null']
              description: La última descripción recibida; `null` si nunca llegó ninguna.
        person:
          type: object
          required: [firstName, lastName, email]
          properties:
            firstName:
              type: string
            lastName:
              type: string
            email:
              type: string
              format: email
              description: En minúsculas. El nombre y el apellido, como se guardaron (ver `PersonName`).
        course:
          type: [object, 'null']
          description: El curso en el que quedó matriculada; `null` mientras espera.
          required: [title, url]
          properties:
            title:
              type: string
            url:
              type: string
              format: uri
        requestedAt:
          type: string
          format: date-time
        enrolledAt:
          type: [string, 'null']
          format: date-time
          description: Desde cuándo cuenta la matrícula; `null` mientras espera, o si ya había completado el curso antes de atenderse.
        certificate:
          type: [object, 'null']
          description: Con `COMPLETED`, el certificado obtenido.
          required: [code, verificationUrl, issuedAt, validUntil]
          properties:
            code:
              type: string
              examples: [CERT-9F2A61C04B-MH8K2X1Q]
            verificationUrl:
              type: string
              format: uri
              description: Página pública que confirma que el certificado es auténtico.
            issuedAt:
              type: string
              format: date-time
            validUntil:
              type: [string, 'null']
              format: date-time
              description: Vencimiento; `null` si no vence.
    Notice:
      type: object
      required: [event, sentAt]
      properties:
        event:
          type: string
          enum: [enrollment-request.updated, ping]
          description: '`enrollment-request.updated` cuando cambia el estado de una solicitud; `ping` en el aviso de prueba del panel.'
        sentAt:
          type: string
          format: date-time
        request:
          $ref: '#/components/schemas/EnrollmentRequest'
          description: Sólo en `enrollment-request.updated`. La solicitud tal como la devolvería su consulta en ese momento.
    Error:
      type: object
      required: [statusCode, error, message, timestamp]
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
          description: En español, para personas. El programa decide por `statusCode`.
        timestamp:
          type: string
          format: date-time
        requestId:
          type: string
          description: Inclúyelo al reportar un problema.
  responses:
    InvalidData:
      description: Datos no válidos. `message` enumera todos los problemas. No reintentar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 400
            error: Bad Request
            message: El campo «sede» no está permitido. El campo «nombre» es obligatorio. El correo electrónico no es válido.
            timestamp: '2026-10-27T13:02:11.484Z'
            requestId: 63f83db3-9b2f-43bb-acb7-907a431ade6f
    InvalidKey:
      description: Falta la clave, no es válida o fue revocada. No reintentar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            statusCode: 401
            error: Unauthorized
            message: La clave de integración no es válida o fue revocada.
            timestamp: '2026-10-27T13:02:11.500Z'
            requestId: 5989f5b9-aab0-4168-9d65-b9ef2ce61e4a
    TooManyRequests:
      description: Demasiadas peticiones seguidas (120 por minuto en cada ruta desde una misma IP; al pedir, 5 por minuto para un mismo correo).
      headers:
        Retry-After:
          description: Segundos que hay que esperar antes de repetir.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: El campus no puede atender ahora (por ejemplo, la base de datos no responde). Reintentar más tarde con el mismo `externalId`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  examples:
    Waiting:
      summary: En espera de que la sede elija el curso de la infracción
      value:
        id: 335fbb2d-16c5-4155-a6ad-e0fb4f3d2589
        externalId: INF-2026-000123
        status: WAITING
        waitingReason: COURSE_NOT_ASSIGNED
        detail: 'En espera por la infracción C29: todavía no se ha elegido el curso que la atiende. La persona quedará matriculada en cuanto se resuelva.'
        country: CO
        infraction: { code: C29, description: Conducir a velocidad superior a la máxima permitida }
        person: { firstName: Laura, lastName: Gómez, email: laura.gomez@example.com }
        course: null
        requestedAt: '2026-10-27T13:02:11.087Z'
        enrolledAt: null
        certificate: null
    Enrolled:
      summary: Matriculada
      value:
        id: 335fbb2d-16c5-4155-a6ad-e0fb4f3d2589
        externalId: INF-2026-000123
        status: ENROLLED
        waitingReason: null
        detail: La persona está matriculada en «Manejo defensivo» y puede empezar cuando quiera.
        country: CO
        infraction: { code: C29, description: Conducir a velocidad superior a la máxima permitida }
        person: { firstName: Laura, lastName: Gómez, email: laura.gomez@example.com }
        course:
          title: Manejo defensivo
          url: https://lms.investigaciongipia.com/courses/0d2e2599-30c4-4d7f-868c-6f33ead6f7e8
        requestedAt: '2026-10-27T13:02:11.087Z'
        enrolledAt: '2026-10-27T15:40:03.512Z'
        certificate: null
    Completed:
      summary: Completó el curso
      value:
        id: 335fbb2d-16c5-4155-a6ad-e0fb4f3d2589
        externalId: INF-2026-000123
        status: COMPLETED
        waitingReason: null
        detail: La persona completó el curso. Certificado CERT-9F2A61C04B-MH8K2X1Q.
        country: CO
        infraction: { code: C29, description: Conducir a velocidad superior a la máxima permitida }
        person: { firstName: Laura, lastName: Gómez, email: laura.gomez@example.com }
        course:
          title: Manejo defensivo
          url: https://lms.investigaciongipia.com/courses/0d2e2599-30c4-4d7f-868c-6f33ead6f7e8
        requestedAt: '2026-10-27T13:02:11.087Z'
        enrolledAt: '2026-10-27T15:40:03.512Z'
        certificate:
          code: CERT-9F2A61C04B-MH8K2X1Q
          verificationUrl: https://lms.investigaciongipia.com/verify?code=CERT-9F2A61C04B-MH8K2X1Q
          issuedAt: '2026-11-02T21:15:47.000Z'
          validUntil: '2027-11-02T21:15:47.000Z'
    Cancelled:
      summary: Matrícula dada de baja
      value:
        id: 335fbb2d-16c5-4155-a6ad-e0fb4f3d2589
        externalId: INF-2026-000123
        status: CANCELLED
        waitingReason: null
        detail: Un administrador dio de baja la matrícula.
        country: CO
        infraction: { code: C29, description: Conducir a velocidad superior a la máxima permitida }
        person: { firstName: Laura, lastName: Gómez, email: laura.gomez@example.com }
        course:
          title: Manejo defensivo
          url: https://lms.investigaciongipia.com/courses/0d2e2599-30c4-4d7f-868c-6f33ead6f7e8
        requestedAt: '2026-10-27T13:02:11.087Z'
        enrolledAt: '2026-10-27T15:40:03.512Z'
        certificate: null
    Rejected:
      summary: Descartada por un administrador
      value:
        id: 335fbb2d-16c5-4155-a6ad-e0fb4f3d2589
        externalId: INF-2026-000123
        status: REJECTED
        waitingReason: null
        detail: Un administrador de la sede la descartó.
        country: CO
        infraction: { code: C29, description: Conducir a velocidad superior a la máxima permitida }
        person: { firstName: Laura, lastName: Gómez, email: laura.gomez@example.com }
        course: null
        requestedAt: '2026-10-27T13:02:11.087Z'
        enrolledAt: null
        certificate: null
    Withdrawn:
      summary: Retirada por el sistema que la pidió
      value:
        id: 335fbb2d-16c5-4155-a6ad-e0fb4f3d2589
        externalId: INF-2026-000123
        status: REJECTED
        waitingReason: null
        detail: La retiró el sistema que la envió.
