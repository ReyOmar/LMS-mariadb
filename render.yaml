# ══════════════════════════════════════════════════════════
# Render Blueprint — LMS PESV Education
# ══════════════════════════════════════════════════════════
# Deploy: Connect this repo in Render Dashboard
# Docs: https://render.com/docs/blueprint-spec
# ══════════════════════════════════════════════════════════

databases:
  - name: lms-db
    plan: free
    databaseName: lms_db
    user: lms_user

services:
  # ── API (NestJS + Fastify) ────────────────────────────
  - type: web
    plan: free
    name: lms-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: lms-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://lms-client-b64v.onrender.com
      - key: APP_URL
        value: https://lms-client-b64v.onrender.com
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: b1746d001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false # Set manually in Render Dashboard
      - key: SMTP_FROM
        value: premiumantigravity@gmail.com
      - key: SMTP_FROM_NAME
        value: Campus Virtual PESV
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: lms-uploads
      - key: R2_PUBLIC_URL
        sync: false
    healthCheckPath: /api/health

  # ── Client (Next.js) ──────────────────────────────────
  - type: web
    plan: free
    name: lms-client
    runtime: docker
    dockerfilePath: ./apps/client/Dockerfile
    dockerContext: ./apps/client
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://lms-api-nsal.onrender.com/api
